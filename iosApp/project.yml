# XcodeGen spec for the ShareCenter iOS app. Generates iosApp.xcodeproj from this file, so the
# project is reproducible and reviewable (no hand-edited .pbxproj). Run `xcodegen generate` here.
#
# The app is a thin SwiftUI host: a pre-build script builds the shared Kotlin framework, and the
# app links + embeds it. See README.md for the full setup.
name: iosApp

options:
  bundleIdPrefix: cut.the.crap
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    dependencies:
      # Embeds ShareExtension.appex into the app bundle's PlugIns folder.
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cut.the.crap.iosApp
        PRODUCT_NAME: ShareCenter
        INFOPLIST_FILE: iosApp/Info.plist
        # App Group entitlement so the app can read the Share Extension's inbox.
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: "5.0"
        # Xcode 15+ sandboxes run-script phases, which blocks gradlew from reading/writing the repo.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Where :shared:embedAndSignAppleFrameworkForXcode places Shared.framework for linking.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # Link the shared framework (the task above also embeds + signs it into the app bundle).
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
        # Runtime search path for the embedded dynamic framework.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    preBuildScripts:
      - name: "Build shared Kotlin framework"
        # Runs on every build; the Gradle task is itself incremental.
        basedOnDependencyAnalysis: false
        script: |
          # Xcode's script env is minimal — make sure Java is reachable. Adjust JAVA_HOME if needed.
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home 2>/dev/null || echo /Users/$USER/android-studio-jbr/Contents/Home)}"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  # The Share Extension: a tiny, pure-Swift app extension that captures a shared URL into the App
  # Group inbox. It does NOT link the Shared framework and needs no Gradle pre-build script — the
  # main app drains the inbox and does the real work (see shared/.../share/ShareInbox.kt).
  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cut.the.crap.iosApp.ShareExtension
        PRODUCT_NAME: ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: "5.0"
